version: 2
updates:
  # Akcje w ci.yml są przypięte do SHA z komentarzem wersji; Dependabot podbija oba naraz.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Paczki npm: korzeń (narzędzia repo), backend, frontend. Na katalog co tydzień jeden PR z minor+patch;
  # major osobno, bo zwykle wymaga zmian w kodzie.
  - package-ecosystem: npm
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
    # Nowe wydanie czeka 7 dni: przejęte wersje paczek npm zwykle są wykrywane i wycofywane w ciągu kilku dni.
    cooldown:
      default-days: 7
    # Grupy dopasowuje kolejno (pierwsza wygrywa). Spójność wersji pilnuje backend/src/__tests__/pinnedDeps.spec.ts.
    groups:
      # Ta sama dokładna wersja we frontendzie i backendzie: jeden PR dla obu katalogów.
      better-auth:
        patterns: [better-auth]
        group-by: dependency-name
      # mongoose i patche mongodb razem. Gdy nowy mongoose zmieni zakres mongodb, test w PR-ze poda zakres do ustawienia.
      mongo:
        patterns: [mongoose, mongodb]
      # @vitest/coverage-v8 musi mieć dokładnie tę samą wersję co vitest.
      vitest:
        patterns: [vitest, '@vitest/*']
      minor-patch:
        update-types: [minor, patch]
    ignore:
      # Zakres idzie za mongoose (ADR-0007): najnowszy minor mongodb zwykle wyprzedza mongoose i daje dwie kopie sterownika.
      - dependency-name: mongodb
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # Typy Node trzymamy na wersji major runtime'u (CI i Docker); podbijamy je razem z Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # shortcut: typescript-eslint nie wspiera TS 7 („does not support TS 7.0”, PR #16/#20, 2026-11-24), zdjąć, gdy wesprze
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
